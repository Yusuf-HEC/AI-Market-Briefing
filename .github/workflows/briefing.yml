name: Briefing de marché

on:
  schedule:
    # Deux déclenchements en UTC, du lundi au vendredi. Le script ne garde que celui qui tombe à 7 h à Paris
    # (5 h UTC en heure d'été, 6 h UTC en heure d'hiver).
    - cron: '0 5 * * 1-5'
    - cron: '0 6 * * 1-5'
  workflow_dispatch:   # bouton "Run workflow" pour lancer à la main

permissions:
  contents: write      # pour sauvegarder le briefing dans le dépôt

jobs:
  briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Générer et envoyer le briefing
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          PRIX_ENTREE: ${{ vars.PRIX_ENTREE }}
          PRIX_SORTIE: ${{ vars.PRIX_SORTIE }}
        run: python briefing.py

      - name: Archiver le briefing dans le dépôt
        run: |
          git config user.name "briefing-bot"
          git config user.email "briefing-bot@users.noreply.github.com"
          git add briefings/ || true
          git diff --cached --quiet || (git commit -m "Briefing du jour" && git push)
